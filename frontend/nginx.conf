server {
    listen 80;
    server_name _;

    # Upload-Größe: nginx deckelt Request-Bodies sonst bei 1 MB (Default) und lehnt
    # schon VOR dem Backend mit 413 ab – dann scheitern Vorlagen-/Anhang-Uploads
    # (Arbeitsvertrag, Kündigung, Fehlerbericht …), obwohl das Backend bis
    # MAX_UPLOAD_MB (Default 25) erlaubt. Mit Puffer über diesem Limit halten; wird
    # MAX_UPLOAD_MB erhöht, diesen Wert mitziehen.
    client_max_body_size 30m;

    root /usr/share/nginx/html;
    index index.html;

    # Sicherheits-Header für die OBERFLÄCHE. Die Backend-Middleware setzt sie nur
    # für API-Antworten; die SPA (index.html + Assets) kommt aber von hier. Ohne
    # sie ließe sich die App von einer anderen Seite derselben Site einbetten
    # (Clickjacking: Klicks auf „Freigeben"/„Löschen" unterschieben).
    # ACHTUNG nginx: ein add_header in einer location ersetzt die der Server-Ebene
    # KOMPLETT – deshalb hier je location vollständig aufgeführt. Jede SPA-Seite
    # (auch Deep-Links per try_files-Fallback) läuft über `= /index.html`.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    location / {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        try_files $uri $uri/ /index.html;
    }

    location ~ ^/(api|auth|logout|start-auth|static)(/|$) {
        proxy_pass         http://${BACKEND_HOST}:5000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cookie_path  / /;
    }
}