[pytest]
# Repo-Root auf den Importpfad, damit `import backend.xxx` funktioniert.
pythonpath = .
testpaths = backend/tests
addopts = -q
markers =
    echter_pool: Test baut den Verbindungs-Pool selbst auf (mit Attrappe statt echter DB)
                 und wird deshalb von der Fail-Fast-Sperre in conftest ausgenommen.
