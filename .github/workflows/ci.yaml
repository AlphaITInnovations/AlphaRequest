name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  backend-tests:
    name: Backend – pytest (Unit, ohne DB)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt
      - name: Lint (ruff)
        run: python -m ruff check backend
      - name: Tests
        run: python -m pytest

  frontend-build:
    name: Frontend – Typecheck, Tests & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Abhängigkeiten installieren
        working-directory: frontend
        run: npm ci || npm install
      - name: Tests (vitest)
        working-directory: frontend
        run: npm run test
      # Prüft AUCH die Testdateien. Der Produktions-Build (unten) tut das bewusst
      # nicht, weil Tests Fixtures von außerhalb frontend/ lesen dürfen – im
      # Docker-Image liegt nur frontend/. Hier ist das ganze Repo da.
      - name: Typecheck (inkl. Tests)
        working-directory: frontend
        run: npm run typecheck
      - name: Build (wie im Docker-Image, ohne Repo-Wurzel)
        working-directory: frontend
        run: npm run build
